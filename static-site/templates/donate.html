{% extends "base.html" %}
{% import "macros.tera.html" as macros %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1>{{ page.title }}</h1>
            {{ page.content | safe }}

            <div class="my-4">
                <a
                    class="btn btn-primary btn-lg"
                    href="{{ config.extra.stripe_donation_portal_url }}"
                    target="_blank"
                    rel="noopener noreferrer"
                >{{ page.extra.button_label }}</a>
            </div>

            <p class="text-muted">
                {{ page.extra.disclosure_intro }}
                <a href="{{ macros::get_url(path='@/commercial-disclosure.md') }}">{{ page.extra.disclosure_label }}</a>{{ page.extra.disclosure_suffix }}
            </p>
        </div>
    </div>
</div>
{% endblock content %}
